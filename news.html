<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富錦文教｜最新消息</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="site-header"></div>
  <script src="partials/site-header.js"></script>

  <section class="page-hero">
    <div class="wrap ph-inner">
      <div class="ph-eyebrow scroll-anim" data-anim="animate__fadeIn">FUJIN EDUCATION · NEWS</div>
      <h1 class="ph-title scroll-anim" data-anim="animate__fadeInUp">最新消息</h1>
      <div class="ph-rule scroll-anim" data-anim="animate__fadeIn" data-delay="0.2s"></div>
      <p class="ph-sub scroll-anim" data-anim="animate__fadeInUp" data-delay="0.3s">恭喜富錦學子再創佳績！展現扎實學理與卓越學習成果。</p>
    </div>
  </section>

  <main class="wrap pb-80">
    <div class="intro-band scroll-anim" data-anim="animate__fadeInUp">
      <div class="band-en">Honor Roll</div>
      <h2 class="band-h">富錦榮譽榜</h2>
      <div class="ornament"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>
    </div>

    <div class="home-honor-wrap">
      <article class="honor-card scroll-anim" data-delay="0.00s" data-anim="animate__fadeInUp">
        <a href="assets/榜單.png" target="_blank" rel="noopener" aria-label="查看放大富錦文教榮譽榜榜單">
          <img src="assets/榜單.png" alt="富錦文教 學測榮耀榜" loading="lazy">
        </a>
        <div class="honor-card-body">
          <span class="honor-card-tag">HONOR ROLL</span>
          <h3 class="honor-card-title">學測榮耀榜</h3>
        </div>
      </article>
    </div>

  </main>

  <div id="site-footer"></div>
  <script src="partials/site-footer.js"></script>


  <!-- Scroll Animation IntersectionObserver Script -->
  <script src="js/scroll-anim.js"></script>

</body>

</html>
